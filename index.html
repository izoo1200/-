<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수다떨쥬 게임 테스트</title>
<style>
:root{color-scheme:dark;--bg:#130f2c;--panel:#211942;--pink:#ff8bd1;--blue:#8be9ff;--gold:#ffe28a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#302052,var(--bg) 65%);color:#fff;font-family:system-ui,sans-serif;padding:20px}main{max-width:1000px;margin:auto}h1{color:var(--pink);letter-spacing:.08em}button,input,select{font:inherit;border-radius:12px;border:1px solid #65558c;padding:10px;background:#17112e;color:#fff}button{cursor:pointer;background:#583b83}button:hover{filter:brightness(1.2)}.panel{background:#211942dd;border:1px solid #544274;border-radius:18px;padding:16px;margin:14px 0}.players,.cards{display:flex;gap:10px;flex-wrap:wrap}.player,.card{border:1px solid #625187;border-radius:14px;padding:12px;background:#18132e;min-width:130px}.player.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.card{width:150px;cursor:pointer}.card.selected{outline:3px solid var(--pink)}.common{color:#ddd}.rare{color:var(--blue)}.epic{color:var(--gold)}.muted{color:#c5badb;font-size:.92rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}.log{white-space:pre-wrap;max-height:220px;overflow:auto;background:#100c20;padding:12px;border-radius:12px}.hp{color:#ff9aa8;font-weight:700}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#3d2b60;font-size:.8rem}
</style></head>
<body><main><h1>수다떨쥬 게임 테스트</h1><p class="muted">로컬 테스트 버전 · 한 기기에서 차례대로 진행합니다. 온라인 멀티플레이는 아직 연결되지 않았어요.</p>
<section class="panel" id="setup"><h2>게임 준비</h2><div class="row"><label>플레이어 수 <select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><button id="start">게임 시작</button></div><p class="muted">시작 HP 30 · 시작 손패 5장 · 공격자는 한 번에 최대 3장 선택 · 턴 제한 30초</p></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><h2 id="turnTitle">차례</h2><span class="pill" id="timer">30초</span></div><div class="players" id="players"></div><p id="status" class="muted"></p></div>
<div class="panel"><h3 id="phaseTitle">행동</h3><p id="instruction"></p><div class="cards" id="hand"></div><div class="row" style="margin-top:12px"><label id="targetWrap">대상 <select id="target"></select></label><button id="submit">선택 완료</button><button id="pass" class="hidden">응답하지 않기</button></div></div>
<div class="panel"><h3>전투 기록</h3><div id="log" class="log"></div></div></section>
</main>
<script>
const CARD_DEFS=[
{id:'atk1',name:'공격 1',rarity:'common',kind:'attack',damage:1},{id:'atk2',name:'공격 2',rarity:'common',kind:'attack',damage:2},{id:'atk3',name:'공격 3',rarity:'common',kind:'attack',damage:3},{id:'atk4',name:'공격 4',rarity:'common',kind:'attack',damage:4},{id:'atk5',name:'공격 5',rarity:'common',kind:'attack',damage:5},{id:'atk6',name:'공격 6',rarity:'common',kind:'attack',damage:6},{id:'atk7',name:'공격 7',rarity:'common',kind:'attack',damage:7},{id:'atk8',name:'공격 8',rarity:'common',kind:'attack',damage:8},{id:'atk9',name:'공격 9',rarity:'common',kind:'attack',damage:9},{id:'atk10',name:'공격 10',rarity:'common',kind:'attack',damage:10},
{id:'def5',name:'방어 5',rarity:'common',kind:'defense',value:5},{id:'heal10',name:'회복 10',rarity:'common',kind:'heal',value:10},{id:'heal20',name:'회복 20',rarity:'common',kind:'heal',value:20},{id:'maxhp',name:'최대 체력 +20',rarity:'common',kind:'maxhp',value:20},
{id:'strong',name:'강력한 공격 20',rarity:'rare',kind:'attack',damage:20},{id:'poison',name:'독 카드',rarity:'rare',kind:'status',status:'독'},{id:'burn',name:'화상 카드',rarity:'rare',kind:'status',status:'화상'},{id:'cleanse',name:'상태효과 회복 포션',rarity:'rare',kind:'cleanse'},{id:'steal',name:'카드 훔치기',rarity:'rare',kind:'steal'},
{id:'angel',name:'천사',rarity:'epic',kind:'angel'},{id:'reflect',name:'반사',rarity:'epic',kind:'reflect'},{id:'swap',name:'체력 교환',rarity:'epic',kind:'swap'},{id:'revive',name:'부활',rarity:'epic',kind:'revive'},{id:'double',name:'동귀어진',rarity:'epic',kind:'double',damage:30}];
let players=[],order=[],turn=0,phase='attack',attacker=null,target=null,selected=[],timer=null,seconds=30,logLines=[],seen={},pendingAttacks=[],responseState={},gameOver=false;
const $=id=>document.getElementById(id);
function log(s){logLines.unshift(s);$('log').textContent=logLines.join('\n')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function alive(){return players.filter(p=>p.alive)}
function refillPool(){return CARD_DEFS.map(c=>({...c}))}
function draw(p,n=1){for(let k=0;k<n;k++){let used=seen[p.id]||[];let available=CARD_DEFS.filter(c=>!used.includes(c.id));if(!available.length){seen[p.id]=[];used=[];available=refillPool();log('모든 카드 종류를 뽑아 개인 카드 풀이 다시 채워졌습니다.')}let rarity=Math.random()<.6?'common':Math.random()<.75?'rare':'epic';let choices=available.filter(c=>c.rarity===rarity);if(!choices.length)choices=available;if(!choices.length)continue;let card={...choices[Math.floor(Math.random()*choices.length)]};used.push(card.id);seen[p.id]=used;p.hand.push(card)}}
function checkDeath(p){if(!p||p.hp>0||!p.alive)return;const i=p.hand.findIndex(c=>c.kind==='revive');if(i>=0){p.hand.splice(i,1);p.hp=30;log(p.name+'의 부활 카드 자동 발동! HP 30으로 부활했습니다.')}else{p.alive=false;log(p.name+' 탈락!')}}
function damage(p,n){if(!p.alive)return;p.hp-=n;log(p.name+' 피해 '+n+' (HP '+Math.max(0,p.hp)+'/'+p.maxHp+')');checkDeath(p)}
function heal(p,n){p.hp=Math.min(p.maxHp,p.hp+n);log(p.name+' HP '+n+' 회복 (현재 '+p.hp+'/'+p.maxHp+')')}
function start(){clearInterval(timer);const n=+$('count').value;players=Array.from({length:n},(_,i)=>({id:i,name:'플레이어 '+(i+1),hp:30,maxHp:30,hand:[],alive:true,status:[],permanentDefense:0}));order=shuffle(players.map(p=>p.id));turn=0;logLines=[];seen={};pendingAttacks=[];gameOver=false;$('submit').disabled=false;$('setup').classList.add('hidden');$('game').classList.remove('hidden');players.forEach(p=>draw(p,5));log('무작위 턴 순서: '+order.map(id=>players[id].name).join(' → '));beginTurn()}
function current(){for(let i=0;i<order.length;i++){const idx=(turn+i)%order.length;if(players[order[idx]].alive){turn=idx;return players[order[idx]]}}return null}
function tickStatuses(p){for(const st of [...p.status]){if(!p.alive)break;damage(p,2);st.left--;if(st.left<=0)p.status=p.status.filter(x=>x!==st);}}
function beginTurn(){clearInterval(timer);if(gameOver)return;attacker=current();if(!attacker||alive().length<=1){finish();return}phase='attack';selected=[];target=null;responseState={defense:0,angel:false,reflect:false};tickStatuses(attacker);if(!attacker.alive){turn=(turn+1)%order.length;beginTurn();return}refresh();startTimer()}
function desc(c){if(c.damage)return '피해 '+c.damage;if(c.kind==='defense')return '공격 피해 '+c.value+' 감소';if(c.kind==='heal')return 'HP '+c.value+' 회복';if(c.kind==='maxhp')return '현재 HP와 최대 HP +20';if(c.kind==='status')return '턴당 2 피해 · 5턴 · 중첩 가능';if(c.kind==='double')return '양쪽에 30 피해';if(c.kind==='swap')return '현재 HP 교환';if(c.kind==='steal')return '상대 손패에서 카드 1장 선택';if(c.kind==='cleanse')return '모든 상태효과 제거';if(c.kind==='angel')return '이번 응답 전투 동안 무제한 방어';if(c.kind==='reflect')return '이번 전투의 공격 반사';if(c.kind==='revive')return '사망 시 자동으로 HP 30 부활';return '효과'}
function refresh(){if(gameOver)return;$('turnTitle').textContent=attacker.name+'의 차례';$('phaseTitle').textContent=phase==='attack'?'공격 카드 선택':'응답 카드 선택';$('instruction').textContent=phase==='attack'?'대상을 고르고 카드 최대 3장을 순서대로 선택하세요. 선택 순서대로 효과가 처리됩니다.':'공개된 카드에 대응할 카드를 선택하세요. 부활은 자동 발동 카드입니다.';$('status').textContent='생존 '+alive().length+'/'+players.length+'명';$('players').innerHTML=players.map(p=>`<div class="player ${p.id===attacker.id?'active':''}"><b>${p.name}</b><div class="hp">HP ${p.hp}/${p.maxHp}</div><div>${p.alive?'생존':'탈락/관전'}</div><div class="muted">손패 ${p.hand.length}장${p.status.length?' · '+p.status.map(s=>s.type+' '+s.left+'턴').join(', '):''}</div></div>`).join('');$('target').innerHTML=alive().filter(p=>p.id!==attacker.id).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('targetWrap').classList.toggle('hidden',phase!=='attack');$('pass').classList.toggle('hidden',phase!=='response');$('submit').textContent=phase==='attack'?'공격 실행':'응답 확정';const owner=phase==='attack'?attacker:target;const hand=owner?owner.hand:[];$('hand').innerHTML=hand.map((c,i)=>`<div class="card ${c.rarity} ${selected.includes(i)?'selected':''}" data-i="${i}"><b>${c.name}</b><div>${c.rarity==='common'?'일반':c.rarity==='rare'?'고급':'최고급'}</div><small>${desc(c)}</small></div>`).join('');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(phase==='attack'&&selected.length>=3){log('공격 카드는 최대 3장까지 선택할 수 있습니다.');return}else selected.push(i);refresh()})}
function startTimer(){clearInterval(timer);seconds=30;$('timer').textContent=seconds+'초';timer=setInterval(()=>{seconds--;$('timer').textContent=seconds+'초';if(seconds<=0){clearInterval(timer);const p=phase==='attack'?attacker:target;if(p&&p.hand.length){const i=Math.floor(Math.random()*p.hand.length);log('시간 초과: '+p.name+'의 '+p.hand[i].name+' 카드가 영구 제거되었습니다.');p.hand.splice(i,1)}if(phase==='attack'){advanceTurn()}else resolveDuel([])}},1000)}
function consume(owner,indices){const chosen=indices.map(i=>owner.hand[i]);owner.hand=owner.hand.filter((c,i)=>!indices.includes(i));draw(owner,chosen.length);return chosen}
$('start').onclick=start;
$('submit').onclick=()=>{if(gameOver)return;clearInterval(timer);if(phase==='attack'){target=players[+$('target').value];if(!target||!target.alive||target.id===attacker.id){log('생존한 대상을 선택하세요.');startTimer();return}const chosen=selected.map(i=>attacker.hand[i]);if(chosen.some(c=>c.kind==='steal')&&!target.hand.length){log('대상 손패가 없어 훔치기 카드를 사용할 수 없습니다.');startTimer();return}pendingAttacks=consume(attacker,selected);selected=[];phase='response';responseState={defense:0,angel:false,reflect:false};log(attacker.name+' → '+target.name+': '+(pendingAttacks.map(c=>c.name).join(', ')||'카드 선택 없음'));refresh();startTimer()}else{const responses=consume(target,selected);selected=[];resolveDuel(responses)}};
$('pass').onclick=()=>{clearInterval(timer);resolveDuel([])};
function resolveDuel(responses){clearInterval(timer);if(gameOver)return;const defender=target;responseState.defense=responses.filter(c=>c.kind==='defense').reduce((a,c)=>a+c.value,0);responseState.angel=responses.some(c=>c.kind==='angel');responseState.reflect=responses.some(c=>c.kind==='reflect');for(const c of responses){if(c.kind==='cleanse'){defender.status=[];log(defender.name+'의 모든 상태효과가 제거되었습니다.')}else if(c.kind==='heal')heal(defender,c.value);else if(c.kind==='maxhp'){defender.maxHp+=20;defender.hp+=20;log(defender.name+'의 최대 HP와 현재 HP가 20 증가했습니다.')}}
for(const c of pendingAttacks){if(!attacker.alive||!defender.alive)break;if(c.kind==='attack'){let dmg=Math.max(0,c.damage-(responseState.angel?999:responseState.defense));if(responseState.reflect&&dmg>0){log('반사! '+attacker.name+'에게 '+dmg+' 피해가 돌아갑니다.');damage(attacker,dmg)}else damage(defender,dmg)}else if(c.kind==='status'){const st={type:c.status,left:5};if(responseState.reflect){log(c.status+' 효과가 반사되었습니다!');attacker.status.push(st)}else{defender.status.push(st);log(defender.name+'에게 '+c.status+' 부여!')}}else if(c.kind==='heal')heal(attacker,c.value);else if(c.kind==='maxhp'){attacker.maxHp+=20;attacker.hp+=20;log(attacker.name+'의 최대 HP와 현재 HP가 20 증가했습니다.')}else if(c.kind==='steal'){if(defender.hand.length){const idx=prompt(defender.name+'의 손패에서 훔칠 카드 번호를 입력하세요:\n'+defender.hand.map((x,i)=>`${i+1}. ${x.name}`).join('\n'));const chosen=Number(idx)-1;if(Number.isInteger(chosen)&&chosen>=0&&chosen<defender.hand.length){attacker.hand.push(defender.hand.splice(chosen,1)[0]);log(attacker.name+'이(가) 카드를 훔쳤습니다.')}else log('훔치기를 취소했습니다.')}}else if(c.kind==='swap'){const hp=attacker.hp;attacker.hp=defender.hp;defender.hp=hp;log('현재 HP를 교환했습니다.');checkDeath(attacker);checkDeath(defender)}else if(c.kind==='double'){damage(defender,30);damage(attacker,30)}}
checkDeath(attacker);checkDeath(defender);log('전투 종료.');if(alive().length<=1){finish();return}advanceTurn()}
function advanceTurn(){turn=(turn+1)%order.length;beginTurn()}
function finish(){clearInterval(timer);gameOver=true;$('phaseTitle').textContent='게임 종료';$('instruction').textContent=alive()[0]?alive()[0].name+' 승리!':'승자가 없습니다.';$('hand').innerHTML='';$('submit').disabled=true;$('pass').classList.add('hidden');$('targetWrap').classList.add('hidden');$('timer').textContent='종료';log('게임 종료! '+(alive()[0]?.name||'승자 없음'))}
</script></body></html>
